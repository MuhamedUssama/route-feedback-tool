<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="mentor_assistant">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <title>mentor_assistant</title>
  <link rel="manifest" href="manifest.json">
</head>
  <style>
    :root {
      --bg-color: #F8FAFC;
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --primary-color: #006D77;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
      }
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--text-primary);
    }

    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background-color: var(--bg-color);
      transition: opacity 0.5s ease-out;
    }

    .icon-container {
      width: 240px;
      height: 240px;
      margin-bottom: 24px;
      animation: fadeIn 0.6s ease-out, scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rocket-icon {
      width: 100%;
      height: 100%;
      fill: var(--primary-color);
      animation: float 4s ease-in-out infinite 2s;
    }

    h1 {
      font-size: 32px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 1.2px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards, slideUp 0.6s ease-out 0.4s forwards;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin: 10px 0 0 0;
      letter-spacing: 1.2px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.8s forwards, slideUp 0.6s ease-out 0.8s forwards;
    }

    .footer {
      position: absolute;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .loading-text {
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
    }

    .progress-bar {
      width: 120px;
      height: 2px;
      background-color: rgba(0, 109, 119, 0.1);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.2s forwards;
    }

    .progress {
      width: 0%;
      height: 100%;
      background-color: var(--primary-color);
      animation: progress 5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.8); }
      to { transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); }
      to { transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>

  <div id="splash" class="splash-container">
    <div class="icon-container">
      <img src="assets/assets/images/logo.png" alt="Logo" class="rocket-icon" style="object-fit: contain;">
    </div>
    <h1>Route Mentor Assistant</h1>
    <h2>Automated Mentoring Tool</h2>
    <div class="footer">
      <div class="loading-text">Initializing System...</div>
      <div class="progress-bar"><div class="progress"></div></div>
    </div>
  </div>

  <script>
    function removeSplash() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }

    window.addEventListener('flutter-first-frame', function () {
      removeSplash();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
